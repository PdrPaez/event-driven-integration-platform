[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "event-driven-integration-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0", "psycopg[binary]>=3.2", "pydantic-settings>=2.5", "aio-pika>=9.4", "alembic>=1.13", "httpx>=0.27", "email-validator>=2.2"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]
[tool.setuptools.packages.find]
where = ["."]
[tool.ruff]
line-length = 100
target-version = "py312"
lint.ignore = ["B008", "BLE001"]
